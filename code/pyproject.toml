[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sepaware-study"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==1.26.4",
  "pandas==2.2.2",
  "scipy==1.13.1",
  "scikit-learn==1.6.1",
  "imbalanced-learn==0.12.3",
  "sdv==1.17.2",
  "catboost==1.2.10",
  "xgboost==3.2.0",
  "statsmodels==0.14.2",
  "matplotlib==3.8.4",
  "seaborn==0.13.2",
  "pyarrow==14.0.2",
  "openpyxl==3.1.2",
  "PyYAML==6.0.1",
]

[project.optional-dependencies]
test = ["pytest==7.4.4"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
