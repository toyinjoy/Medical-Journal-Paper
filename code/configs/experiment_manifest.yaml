study:
  title: Separability-Aware Synthetic Data Selection for Rare-Outcome Prediction in Health Data
  protocol_version: 1.0.0
  python: "3.12"
  primary_endpoint: auprc
  primary_contrasts:
    - [SepAware CTGAN, Standard CTGAN]
    - [SepAware TVAE, Standard TVAE]
  multiplicity: holm
  folds: 5
  repeats: 3
  partition_seeds: [42, 43, 44]
  generator_seed_base: 10000
  generator_epochs: 30
  candidate_pool_multiplier: 5
  augmentation_target: balance_positive_to_negative_count
  prediction_threshold: 0.5
  classifiers: [LogisticRegression, RandomForest, CatBoost]
  metrics: [auprc, auroc, macro_f1, positive_f1, positive_precision, positive_recall, balanced_accuracy, brier, calibration_intercept, calibration_slope]
  diagnostics: [coverage_distance, diversity, exact_match_rate, membership_proxy_auroc, marginal_similarity, correlation_similarity, detection_auroc]
  sepaware:
    lambda_separability: 1.0
    lambda_anchor: 0.0
    robust_clip: 3.0
    scale_epsilon: 1.0e-12
    separability_margin_weight: 0.5
    separability_probability_weight: 0.5
    tie_break: stable_candidate_index

tasks:
  vigitel_obesity:
    display_name: Vigitel obesity
    source_name: Vigitel surveillance extract
    path: vigitel2006_2023_obesidade_exclusoes.parquet
    sha1: 1a4ac0d68a420f1367ab894fadd6b69b4738d94b
    loader: parquet
    outcome: desfecho
    positive_definition: obesity indicator equals 1
    inclusion: rows with a nonmissing binary outcome; reproducible stratified analytic sample
    exclusion: identifiers and variables not in the prespecified feature list
    sample_n: 5000
    expected_positive: 851
    expected_negative: 4149
    features: [age, sex, fumante, exfuma, inativo, ativo_livre, ati_livre, diab, hart, dislipidemia, doces5, lanche_7, gordura, flvreg, years_schooling]
    categorical: [sex, fumante, exfuma, inativo, ativo_livre, diab, hart, dislipidemia, doces5, lanche_7, gordura, flvreg]
    numerical: [age, ati_livre, years_schooling]
    leakage_exclusions: [chave, desfecho, ano, cidade]
    missing_values: training_fold_median_for_numeric_and_mode_for_categorical
    group_column: null
    applicable: [augmentation, tstr, fidelity, coverage_diversity, exact_match, membership_proxy, calibration]
    non_applicable:
      temporal_validation: no prospective time field is used in the analytic task

